services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: rutasur-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # Crea los 6 topics del catálogo
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        T="/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --partitions 3 --replication-factor 1"
        D30=2592000000   # 30 días en ms
        D7=604800000     # 7 días en ms
        $$T --topic envios.estados          --config retention.ms=$$D30
        $$T --topic envios.promesas         --config cleanup.policy=compact
        $$T --topic envios.reprogramaciones --config retention.ms=$$D30
        $$T --topic alertas.sla             --config retention.ms=$$D7
        $$T --topic notificaciones.enviadas --config retention.ms=$$D7
        $$T --topic envios.estados.dlq      --config retention.ms=$$D30
        echo "Topics listos"

  # MongoDB como replica set de un solo nodo (necesario para change streams)
  mongo:
    image: mongo:7
    container_name: rutasur-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # --- Servicios Dockerizados para arranque en "máquina limpia" con un solo comando ---
  simulator:
    build: .
    container_name: rutasur-simulator
    command: ["pnpm", "--filter", "@rutasur/simulator", "start"]
    ports:
      - "4000:4000"
    environment:
      KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  projector:
    build: .
    container_name: rutasur-projector
    command: ["pnpm", "--filter", "@rutasur/projector", "start"]
    environment:
      KAFKA_BROKERS: kafka:29092
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  notifications:
    build: .
    container_name: rutasur-notifications
    command: ["pnpm", "--filter", "@rutasur/notifications", "start"]
    environment:
      KAFKA_BROKERS: kafka:29092
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  rescheduling:
    build: .
    container_name: rutasur-rescheduling
    command: ["pnpm", "--filter", "@rutasur/rescheduling", "start"]
    environment:
      KAFKA_BROKERS: kafka:29092
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  sla-monitor:
    build: .
    container_name: rutasur-sla-monitor
    command: ["pnpm", "--filter", "@rutasur/sla-monitor", "start"]
    environment:
      KAFKA_BROKERS: kafka:29092
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  analytics:
    build: .
    container_name: rutasur-analytics
    command: ["pnpm", "--filter", "@rutasur/analytics", "start"]
    environment:
      KAFKA_BROKERS: kafka:29092
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  web:
    build: .
    container_name: rutasur-web
    command: ["pnpm", "--filter", "@rutasur/web", "dev"]
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017/?directConnection=true
      SIMULATOR_URL: http://simulator:4000
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  kafka-data:
  mongo-data:
